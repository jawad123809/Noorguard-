name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Find and Extract ZIP File
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
        else
          echo "No ZIP file found, continuing..."
        fi

    - name: Locate Android Project Root
      run: |
        GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
        if [ -n "$GRADLE_DIR" ]; then
          echo "Found Gradle root at: $GRADLE_DIR"
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission
      run: chmod +x ${{ env.PROJECT_DIR }}/gradlew || true

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: noorguard-app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
